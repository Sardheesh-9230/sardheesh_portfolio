<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-realistic gradient background -->
    <radialGradient id="studioBackground" cx="50%" cy="40%" r="80%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </radialGradient>
    
    <!-- Professional skin tone -->
    <radialGradient id="skinTone" cx="40%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </radialGradient>
    
    <!-- Modern hair styling -->
    <radialGradient id="modernHair" cx="50%" cy="20%" r="85%">
      <stop offset="0%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Professional attire -->
    <linearGradient id="professionalSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Modern tie/shirt -->
    <linearGradient id="businessShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Studio background with professional lighting -->
  <circle cx="200" cy="200" r="200" fill="url(#studioBackground)" />
  
  <!-- Professional studio lighting effects -->
  <ellipse cx="150" cy="150" rx="100" ry="120" fill="rgba(255,255,255,0.08)" opacity="0.6" />
  <ellipse cx="250" cy="180" rx="80" ry="100" fill="rgba(255,255,255,0.05)" opacity="0.4" />
  
  <!-- Body/Suit jacket -->
  <ellipse cx="200" cy="360" rx="140" ry="85" fill="url(#professionalSuit)" />
  
  <!-- Shirt -->
  <ellipse cx="200" cy="330" rx="100" ry="60" fill="url(#businessShirt)" />
  
  <!-- Professional tie -->
  <ellipse cx="200" cy="310" rx="15" ry="40" fill="#dc2626" />
  <path d="M 190 290 L 210 290 L 205 340 L 195 340 Z" fill="#b91c1c" />
  
  <!-- Suit lapels -->
  <path d="M 120 300 L 180 280 L 200 300 L 170 320 L 140 340" fill="url(#professionalSuit)" />
  <path d="M 280 300 L 220 280 L 200 300 L 230 320 L 260 340" fill="url(#professionalSuit)" />
  
  <!-- Neck with realistic shading -->
  <ellipse cx="200" cy="285" rx="28" ry="38" fill="url(#skinTone)" />
  <ellipse cx="195" cy="280" rx="25" ry="33" fill="rgba(0,0,0,0.05)" />
  
  <!-- Face with professional lighting -->
  <ellipse cx="200" cy="220" rx="65" ry="75" fill="url(#skinTone)" />
  
  <!-- Facial shading for depth -->
  <ellipse cx="205" cy="225" rx="60" ry="70" fill="rgba(0,0,0,0.08)" />
  <ellipse cx="185" cy="210" rx="30" ry="35" fill="rgba(255,255,255,0.15)" />
  
  <!-- Professional hairstyle -->
  <ellipse cx="200" cy="175" rx="75" ry="55" fill="url(#modernHair)" />
  <path d="M 130 160 Q 165 140 200 145 Q 235 140 270 160 Q 260 130 225 125 Q 200 120 175 125 Q 140 130 130 160 Z" fill="url(#modernHair)" />
  
  <!-- Modern side part -->
  <path d="M 165 150 Q 200 145 235 150" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none" />
  
  <!-- Eyes with depth -->
  <ellipse cx="182" cy="210" rx="12" ry="8" fill="#ffffff" />
  <ellipse cx="218" cy="210" rx="12" ry="8" fill="#ffffff" />
  <ellipse cx="182" cy="210" rx="8" ry="6" fill="#3b82f6" />
  <ellipse cx="218" cy="210" rx="8" ry="6" fill="#3b82f6" />
  <ellipse cx="182" cy="210" rx="4" ry="4" fill="#1e40af" />
  <ellipse cx="218" cy="210" rx="4" ry="4" fill="#1e40af" />
  
  <!-- Eye highlights -->
  <ellipse cx="185" cy="207" rx="2" ry="2" fill="#ffffff" />
  <ellipse cx="221" cy="207" rx="2" ry="2" fill="#ffffff" />
  
  <!-- Professional eyebrows -->
  <path d="M 168 195 Q 182 190 196 195" stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 204 195 Q 218 190 232 195" stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Nose with realistic shading -->
  <ellipse cx="200" cy="225" rx="8" ry="12" fill="rgba(0,0,0,0.05)" />
  <path d="M 200 220 Q 203 228 200 235 Q 197 228 200 220" fill="rgba(0,0,0,0.1)" />
  
  <!-- Professional smile -->
  <path d="M 185 250 Q 200 260 215 250" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 188 252 Q 200 258 212 252" stroke="rgba(255,255,255,0.5)" stroke-width="1" fill="none" />
  
  <!-- Cheekbone definition -->
  <ellipse cx="160" cy="230" rx="15" ry="8" fill="rgba(0,0,0,0.03)" />
  <ellipse cx="240" cy="230" rx="15" ry="8" fill="rgba(0,0,0,0.03)" />
  
  <!-- Professional collar details -->
  <path d="M 170 280 L 200 275 L 230 280 L 220 290 L 180 290 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Suit button -->
  <circle cx="200" cy="320" r="4" fill="#64748b" />
  <circle cx="200" cy="320" r="2" fill="#334155" />
  
  <!-- Tech industry elements -->
  <g opacity="0.15" stroke="#00d4ff" stroke-width="1.5" fill="none">
    <rect x="60" y="80" width="20" height="20" rx="3" />
    <rect x="320" y="100" width="15" height="15" rx="2" />
    <path d="M 85 90 L 110 90 L 110 70 L 125 70" />
    <path d="M 320 108 L 300 108 L 300 125 L 285 125" />
    <circle cx="125" cy="70" r="4" />
    <circle cx="285" cy="125" r="4" />
  </g>
  
  <!-- AI/Tech badge -->
  <g opacity="0.4" transform="translate(330, 330)">
    <rect x="-20" y="-15" width="40" height="30" rx="15" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1" />
    <text x="0" y="3" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="10" font-weight="bold">AI GEN</text>
  </g>
  
  <!-- Professional photo signature -->
  <g opacity="0.2" transform="translate(70, 350)">
    <text x="0" y="0" fill="white" font-family="Arial, sans-serif" font-size="8">Professional Portfolio Photo</text>
  </g>
</svg>