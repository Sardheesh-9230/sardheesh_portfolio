<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional gradient background -->
    <radialGradient id="backgroundGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </radialGradient>
    
    <!-- Face gradient -->
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Hair gradient -->
    <radialGradient id="hairGradient" cx="50%" cy="20%" r="80%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </radialGradient>
    
    <!-- Shirt gradient -->
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#backgroundGradient)" />
  
  <!-- Professional lighting effect -->
  <circle cx="180" cy="180" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <circle cx="160" cy="160" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  
  <!-- Body/Shirt -->
  <ellipse cx="200" cy="350" rx="120" ry="80" fill="url(#shirtGradient)" />
  
  <!-- Neck -->
  <ellipse cx="200" cy="290" rx="25" ry="35" fill="url(#faceGradient)" />
  
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="60" ry="70" fill="url(#faceGradient)" />
  
  <!-- Hair -->
  <ellipse cx="200" cy="180" rx="70" ry="50" fill="url(#hairGradient)" />
  <path d="M 140 160 Q 180 140 220 160 Q 240 170 260 180 Q 250 150 220 140 Q 200 130 180 140 Q 160 150 140 160 Z" fill="url(#hairGradient)" />
  
  <!-- Eyes -->
  <ellipse cx="185" cy="210" rx="8" ry="6" fill="#1f2937" />
  <ellipse cx="215" cy="210" rx="8" ry="6" fill="#1f2937" />
  <ellipse cx="187" cy="208" rx="3" ry="3" fill="#ffffff" />
  <ellipse cx="217" cy="208" rx="3" ry="3" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M 175 200 Q 185 195 195 200" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 205 200 Q 215 195 225 200" stroke="#374151" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Nose -->
  <path d="M 200 220 Q 205 230 200 235" stroke="rgba(0,0,0,0.1)" stroke-width="1.5" fill="none" />
  
  <!-- Mouth -->
  <path d="M 190 245 Q 200 255 210 245" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Professional collar -->
  <path d="M 150 320 L 200 300 L 250 320 L 240 350 L 160 350 Z" fill="url(#shirtGradient)" />
  <path d="M 180 300 L 200 290 L 220 300 L 210 320 L 190 320 Z" fill="#4f46e5" />
  
  <!-- Subtle shadows for depth -->
  <ellipse cx="205" cy="225" rx="55" ry="65" fill="rgba(0,0,0,0.1)" />
  
  <!-- Professional lighting highlight -->
  <ellipse cx="185" cy="200" rx="20" ry="25" fill="rgba(255,255,255,0.15)" />
  
  <!-- Tech elements (subtle circuit pattern) -->
  <g opacity="0.1" stroke="#00d4ff" stroke-width="1" fill="none">
    <circle cx="80" cy="100" r="15" />
    <circle cx="320" cy="120" r="12" />
    <path d="M 95 100 L 130 100 L 130 80" />
    <path d="M 305 120 L 280 120 L 280 140" />
    <circle cx="130" cy="80" r="5" />
    <circle cx="280" cy="140" r="5" />
  </g>
  
  <!-- Professional badge/watermark -->
  <g opacity="0.3" transform="translate(320, 320)">
    <circle cx="0" cy="0" r="25" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI</text>
  </g>
</svg>